
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聯絡我們</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>聯絡我們</h1>
        <nav>
            <a href="index.html">首頁</a>
            <a href="about.html">關於我</a>
            <a href="contact.html">聯絡我</a>
        </nav>
    </header>

    <main>
        <section class="contact-section">
            <h2>歡迎與我聯絡</h2>
            <p>如果有任何問題或合作需求，歡迎填寫以下表單。</p>

            <!-- Formspree 聯絡表單 -->
            <form action="https://formspree.io/f/xoeelppq" method="POST">

                <label for="name">姓名</label>
                <input
                    type="text"
                    id="name"
                    name="姓名"
                    placeholder="請輸入您的姓名"
                    required
                >

                <label for="phone">電話</label>
                <input
                    type="tel"
                    id="phone"
                    name="電話"
                    placeholder="請輸入您的電話"
                    required
                >

                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="Email"
                    placeholder="請輸入您的 Email"
                    required
                >

                <label for="message">聯絡內容</label>
                <textarea
                    id="message"
                    name="聯絡內容"
                    rows="6"
                    placeholder="請輸入您想告訴我的內容"
                    required
                ></textarea>

                <button type="submit">送出表單</button>

            </form>

            <p class="form-disclaimer">
                按下送出後，資料會透過 Formspree 傳送。
                請勿填寫密碼或其他敏感資訊。
            </p>
        </section>
    </main>

    <footer>
        <p>© 2026 我的個人網站</p>
    </footer>

</body>
</html>
